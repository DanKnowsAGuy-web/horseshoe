<style>
  :root{--graphite:#174e58;--graphite-2:#1f5c67;--ink:#101416;--rule:#d3d9dd;--card:#fff;--panel-body:#c6d7da;--panel-faint:#9fbcc1;--amber:#e0a21c}
  *{box-sizing:border-box;margin:0}
  html,body{min-height:100%}
  body{background:var(--graphite);color:#fff;font-family:'Archivo',system-ui,sans-serif;font-size:1.05rem;line-height:1.6;min-height:100vh;display:grid;place-items:center;padding:1.5rem;-webkit-font-smoothing:antialiased}
